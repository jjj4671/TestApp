<style>
  :root {
    --bg: #11100e;
    --text: #f4f0e8;
    --muted: #8f887e;
    --line: rgba(244,240,232,.12);
    --serif: "Iowan Old Style", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.35;
    overscroll-behavior: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid #c6a36a; outline-offset: 3px; }
  #app {
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  header { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
  #back { color: var(--muted); font-size: 16px; }
  #back[hidden] { visibility: hidden; }
  #count { color: var(--muted); font-size: 13px; letter-spacing: .14em; }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 42px;
    letter-spacing: -.035em;
    line-height: 1;
    margin: 36px 0 10px;
  }
  #sub { margin: 0; color: var(--muted); min-height: 1.4em; }
  #choices { margin-top: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch i {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.16);
  }
  .swatch span { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.15; }
  .swatch:active i { transform: scale(.94); }
  .row {
    width: 100%;
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 14px;
    align-items: center;
    text-align: left;
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .dot {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.16);
    display: block;
  }
  .row b { font-weight: 500; font-size: 18px; }
  .pct { font-variant-numeric: tabular-nums; font-size: 20px; letter-spacing: -.03em; }
  .pieces { display: flex; gap: 22px; margin-top: 48px; }
  .pieces i {
    display: block; width: 64px; height: 64px; border-radius: 50%;
    margin-bottom: 12px; border: 1px solid rgba(255,255,255,.16);
  }
  .pieces strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 22px; }
  .pieces span { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  #again { margin-top: 40px; color: var(--muted); font-size: 16px; align-self: flex-start; }

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  const l = (max+min)/2;
  let h = 0, s = 0;
  const d = max-min;
  if (d) {
    s = d / (1 - Math.abs(2*l-1));
    if (max === r) h = ((g-b)/d) % 6;
    else if (max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return {h, s:s*100, l:l*100};
}
function hslToHex(h,s,l) {
  s/=100; l/=100;
  const a = s * Math.min(l, 1-l);
  const f = n => {
    const k = (n + h/30) % 12;
    const c = l - a * Math.max(Math.min(k-3, 9-k, 1), -1);
    return Math.round(255*c).toString(16).padStart(2,"0");
  };
  return "#"+f(0)+f(8)+f(4);
}
function shade(hex, t) {
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = c => {
    const x = t<0 ? c*(1+t) : c+(255-c)*t;
    return Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2,"0");
  };
  return "#"+f(r)+f(g)+f(b);
}
function hueDist(a,b) {
  let d = Math.abs(a-b);
  return d>180 ? 360-d : d;
}
const PALETTE = RAW.map(([id,name,hex,family,undertone]) => ({id,name,hex,family,undertone,...hexToHsl(hex)}));
const byId = Object.fromEntries(PALETTE.map(c => [c.id, c]));

function autoSeason() {
  const m = new Date().getMonth();
  if (m<=1 || m===11) return "winter";
  if (m<=4) return "spring";
  if (m<=7) return "summer";
  return "autumn";
}
function allowed(list, occ, season) {
  return list.filter(t => (!t.occasions || t.occasions.includes(occ)) && (!t.seasons || t.seasons.includes(season)));
}

}
function pickType(list, id, occ, season, fallback) {
  const ok = allowed(list, occ, season);
  if (ok.some(t => t.id===id)) return id;
  if (ok.some(t => t.id===fallback)) return fallback;
  return ok[0] ? ok[0].id : id;
}

function judgeBottom(top, bottom, ctx, bottomType){
  let score = 40;
  const tags = [];
  const classic = (CLASSICS[top.id]||[]).includes(bottom.id);
  if (classic) { score += 24; tags.push("classic"); }
  if (MUD.has(top.id+"|"+bottom.id)) score -= 22;
  const d = hueDist(top.h, bottom.h);
  const dL = Math.abs(top.l-bottom.l);
  const neutralB = bottom.family==="neutral" || bottom.s<14;
  const neutralT = top.family==="neutral" || top.s<14;
  if (neutralB && !neutralT) {
    score += 28; tags.push("anchor");
    if (dL>18 && dL<70) score += 10;
  } else if (neutralT && neutralB) {
    if (dL>28) { score += 30; tags.push("tonal"); }
    else if (dL>16) { score += 8; tags.push("tonal"); }
    else score -= 20;
  } else if (d<15) {
    if (dL>30) { score += 24; tags.push("tonal"); }
    else score -= 24;
  } else if (d<=46) {
    score += 20; tags.push("neighbor");
    if (bottom.s+10<top.s) score += 8;
  } else if (d>=150) {
    if (bottom.s<50 || dL>26 || neutralB) { score += 18; tags.push("complement"); }
    else score -= 6;
  } else if (d>=68 && d<=112) {
    score -= 8;
    if (bottom.s<30 || neutralB) score += 16;
  } else score += 8;
  if (dL<12 && top.s>16 && bottom.s>16) score -= 16;
  if (dL>=22 && dL<=58) score += 8;
  if (top.s>50 && bottom.s>55 && d>16 && !classic) score -= 16;
  if (ctx.season==="autumn" && ["camel","tan","cognac","rust","burgundy","olive","chocolate","brown","khaki","terracotta","wine"].includes(bottom.id)) score += 6;
  if (ctx.season==="summer" && ["white","ivory","sand","stone","khaki","cream"].includes(bottom.id)) score += 5;
  if (ctx.season==="winter" && ["navy","charcoal","black","burgundy","ink","chocolate","indigo"].includes(bottom.id)) score += 5;
  if (ctx.season==="spring" && ["sage","blush","cream","powder","sky","stone"].includes(bottom.id)) score += 5;
  let tag = "works";
  for (const key of ["classic","anchor","tonal","complement","neighbor"]) if (tags.includes(key)) { tag = key; break; }
  return {score: Math.max(1, Math.round(score)), tag};
}
function rankBottoms(){
  if (!state.top.color) return [];
  const ctx = {occasion:state.occasion, season:state.season};
  return PALETTE.filter(c => c.hex!==state.top.color.hex).map(color => {
    const j = judgeBottom(state.top.color, color, ctx, state.bottom.type);
    return {color, ...j};
  }).sort((a,b)=>b.score-a.score);
}
function judgeShoe(top, bottom, shoe, ctx, shoeType){
  let score = 36;
  const tags = [];
  const dB = hueDist(shoe.h, bottom.h);
  const dLB = Math.abs(shoe.l-bottom.l);
  const echo = dB<16 && dLB<20;
  const ground = (shoe.family==="neutral" || shoe.s<18) && shoe.l<24;
  const classic = (SHOE_WITH[bottom.id]||[]).includes(shoe.id);
  if (echo) { score += 30; tags.push("echo"); }
  if (ground) { score += 26; tags.push("ground"); }
  if (classic) { score += 18; tags.push("classic"); }
  const neutralS = shoe.family==="neutral" || shoe.s<16 || SHOE_IDS.includes(shoe.id);
  if (!neutralS && hueDist(shoe.h, top.h)>28 && dB>28 && !classic) score -= 18;
  if ((shoeType==="loafer"||shoeType==="boot") && ["cognac","black","chocolate","brown","burgundy","tan"].includes(shoe.id)) score += 8;
  if (bottom.id==="black" && (shoe.id==="cognac"||shoe.id==="brown")) score -= 8;
  let tag = tags.includes("echo") ? "echo" : tags.includes("classic") ? "classic" : tags.includes("ground") ? "ground" : "works";
  return {score: Math.max(1, Math.round(score)), tag};
}
function rankShoes(){
  if (!state.top.color || !state.bottom.color) return [];
  const ctx = {occasion:state.occasion, season:state.season};
  return PALETTE.filter(c => SHOE_IDS.includes(c.id)).map(color => {
    const j = judgeShoe(state.top.color, state.bottom.color, color, ctx, state.shoes.type);
    return {color, ...j};
  }).sort((a,b)=>b.score-a.score);
}
const state = {
  occasion: "off",
  season: autoSeason(),
  top: { type: "tee", color: null },
  bottom: { type: "chinos", color: null },
  shoes: { type: "loafer", color: null },
  layer: null,
  step: "top"
};
function freeze(c){
  if (!c) return null;
  return {id:c.id, name:c.name, hex:c.hex, h:c.h, s:c.s, l:c.l, family:c.family, undertone:c.undertone};
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function pct(score, best){
  if (!best) return 0;
  return Math.max(34, Math.min(98, Math.round(score / best * 97)));
}
function show(list){
  const best = list.length ? list[0].score : 1;
  return list.slice(0, 7).map(r => ({...r, pct: pct(r.score, best)}));
}
function render(){
  const ask = document.getElementById("ask");
  const sub = document.getElementById("sub");
  const box = document.getElementById("choices");
  const back = document.getElementById("back");
  const count = document.getElementById("count");
  back.hidden = state.step === "top";
  if (state.step === "top") {
    ask.textContent = "Pick a top";
    sub.textContent = "The rest follows this color.";
    count.textContent = "1 / 3";
    box.innerHTML = `<div class="grid">${PALETTE.map(c =>
      `<button type="button" class="swatch" data-act="top" data-id="${c.id}" aria-label="${esc(c.name)}"><i style="background:${c.hex}"></i><span>${esc(c.name)}</span></button>`
    ).join("")}</div>`;
    return;
  }
  if (state.step === "pants") {
    ask.textContent = "Pants";
    sub.textContent = "How well each sits with " + state.top.color.name.toLowerCase() + ".";
    count.textContent = "2 / 3";
    box.innerHTML = show(rankBottoms()).map(r =>
      `<button type="button" class="row" data-act="pants" data-id="${esc(r.color.id)}"><i class="dot" style="background:${r.color.hex}"></i><b>${esc(r.color.name)}</b><span class="pct">${r.pct}%</span></button>`
    ).join("");
    return;
  }
  if (state.step === "shoes") {
    ask.textContent = "Shoes";
    sub.textContent = "For " + state.top.color.name.toLowerCase() + " and " + state.bottom.color.name.toLowerCase() + ".";
    count.textContent = "3 / 3";
    box.innerHTML = show(rankShoes()).map(r =>
      `<button type="button" class="row" data-act="shoes" data-id="${esc(r.color.id)}"><i class="dot" style="background:${r.color.hex}"></i><b>${esc(r.color.name)}</b><span class="pct">${r.pct}%</span></button>`
    ).join("");
    return;
  }
  const t = state.top.color, b = state.bottom.color, s = state.shoes.color;
  const pantsPct = show(rankBottoms()).find(r => r.color.hex===b.hex);
  const shoePct = show(rankShoes()).find(r => r.color.hex===s.hex);
  const together = Math.round(((pantsPct?pantsPct.pct:90) + (shoePct?shoePct.pct:90)) / 2);
  ask.textContent = "This one.";
  sub.textContent = together + "% together.";
  count.textContent = "";
  back.hidden = false;
  box.innerHTML = `
    <div class="pieces">
      <div><i style="background:${t.hex}"></i><strong>${esc(t.name)}</strong><span>Top</span></div>
      <div><i style="background:${b.hex}"></i><strong>${esc(b.name)}</strong><span>Pants</span></div>
      <div><i style="background:${s.hex}"></i><strong>${esc(s.name)}</strong><span>Shoes</span></div>
    </div>
    <button type="button" id="again" data-act="again">Start over</button>`;
}
document.body.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === "top") {
    state.top.color = freeze(byId[id]);
    state.bottom.color = null;
    state.shoes.color = null;
    state.step = "pants";
  } else if (b.dataset.act === "pants") {
    state.bottom.color = freeze(byId[id]);
    state.shoes.color = null;
    state.step = "shoes";
  } else if (b.dataset.act === "shoes") {
    const color = byId[id] || state.bottom.color;
    state.shoes.color = freeze(color);
    state.step = "done";
  } else if (b.dataset.act === "back") {
    if (state.step === "pants") state.step = "top";
    else if (state.step === "shoes") state.step = "pants";
    else if (state.step === "done") state.step = "shoes";
  } else if (b.dataset.act === "again") {
    state.top.color = null;
    state.bottom.color = null;
    state.shoes.color = null;
    state.step = "top";
  }
  render();
});
render();

</script>
